name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # build 期间会执行路由模块与 SQLite 初始化，需要 dummy JWT_SECRET
      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-build-only-dummy-secret-0123456789abcdef
